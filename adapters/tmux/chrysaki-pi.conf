# Chrysaki Pi optional tmux forwarding adapter
#
# User-applied only. This does not replace the existing Prefix+Space
# (Ctrl+Space, Space) Chrysaki tmux palette.
#
# Install:
#   cat /path/to/chrysaki-pi/adapters/tmux/chrysaki-pi.conf >> ~/.tmux.conf
#   tmux source-file ~/.tmux.conf
#
# Ctrl+Space, p forwards Pi's Ctrl+Shift+P command-deck shortcut to the pane.
bind-key p send-keys C-S-p
